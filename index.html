<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F2B48E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Elina — ресторан для хомячков</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root { --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); }
    html, body { margin: 0; width: 100%; height: 100%; background: #F2B48E; overflow: hidden; overscroll-behavior: none; }
    body { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; position: fixed; inset: 0; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="game" width="1230" height="1280"></canvas>
  <script src="js/logic.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/art.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
